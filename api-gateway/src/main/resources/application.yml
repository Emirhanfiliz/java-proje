server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        - id: workout-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/workouts/**

        - id: statistics-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/statistics/**
