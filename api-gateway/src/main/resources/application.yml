server:
  port: 8084

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        - id: workout-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/workouts/**

        - id: statistics-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/statistics/**

jwt:
  secret-key: "sport-tracker-super-secret-key-must-be-at-least-256-bits-long!"
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000
