services:
  mongodb:
    image: mongo:latest
    container_name: sport-tracker-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  postgres:
    image: postgres:15
    container_name: sport-tracker-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: sport_tracker_statistics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: sport-tracker-redis
    ports:
      - "6379:6379"

  adminer:
    image: adminer:latest
    container_name: sport-tracker-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - mongodb

volumes:
  mongodb_data:
  postgres_data:
