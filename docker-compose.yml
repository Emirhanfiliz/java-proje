services:
  mongodb:
    image: mongo:latest
    container_name: sport-tracker-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  mysql:
    image: mysql:8.0
    container_name: sport-tracker-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sport_tracker_workout
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:latest
    container_name: sport-tracker-redis
    ports:
      - "6379:6379"

  adminer:
    image: adminer:latest
    container_name: sport-tracker-adminer
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - mongodb

volumes:
  mongodb_data:
  mysql_data:
